name: Streamlit 앱 깨워 두기

on:
  schedule:
    - cron: "17 */4 * * *"   # 4시간마다 (UTC 기준, 매시 17분)
  workflow_dispatch:          # Actions 화면에서 직접 실행 버튼

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 브라우저 설치
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: 앱 방문
        run: python keep_awake.py
